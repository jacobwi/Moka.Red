# Moka.Red Documentation
site:
  title: "Moka.Red"
  description: "A lightweight, performance-focused Blazor UI component library"
  logo: assets/logo.png
  favicon: assets/favicon.png
  copyright: "MIT License"

content:
  docs: ./docs

# mokadocs reads `nav:` with `label`, a route `path` and `children`. Other keys, such as
# `navigation:` with `title`/`items`, are dropped without a warning and the sidebar falls
# back to one generated from folder names.
