name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Moka.Red.slnx

      - name: Build
        run: dotnet build Moka.Red.slnx --no-restore --configuration Release -warnaserror

      # xunit.v3 4.x runs on Microsoft.Testing.Platform (opted in via global.json),
      # so trx output uses MTP's report options, not the VSTest --logger syntax.
      - name: Test
        run: dotnet test Moka.Red.slnx --no-build --configuration Release --report-trx --report-trx-filename test-results.trx

      # Checked here so a release is never tagged with packages that lost their XML docs, which IntelliSense reads.
      - name: Pack and check the XML docs
        run: |
          dotnet pack Moka.Red.slnx --no-build --configuration Release --output ./nupkgs
          bash scripts/check-package-docs.sh ./nupkgs 12

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

  # Trimming can break what the analyzer cannot see, and only a published build is trimmed. The
  # runner's own Chrome drives it, so nothing downloads a browser.
  wasm-smoke:
    name: Trimmed WebAssembly smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish the WASM sample
        run: dotnet publish samples/Moka.Red.WasmApp --configuration Release --output artifacts/wasm

      - name: Install playwright-core
        run: npm install --prefix "$RUNNER_TEMP/node" --no-save --no-audit --no-fund --loglevel=error playwright-core@1.64.1

      - name: Drive the published app
        run: node scripts/wasm-smoke.cjs artifacts/wasm
        env:
          NODE_PATH: ${{ runner.temp }}/node/node_modules
          BROWSER_CHANNEL: chrome
